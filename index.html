<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal Demo - 仅学习演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#0f0;
  font-family:Consolas,monospace;
  padding:20px;
  font-size:14px;
  line-height:1.6;
}
#screen{
  white-space:pre-wrap;
}
.blink{
  animation: blink 0.8s infinite;
}
@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0}
}
</style>
</head>
<body>
<div id="screen"></div>
<script>
const text = `
[ SYSTEM INITIALIZE ... OK ]
[ LOAD MODULE ... OK ]
[ SCAN NETWORK ... ]
>> Finding target node...
>> Connection establishing...
>> WARNING: This is DEMO ONLY
>> NO ATTACK CODE INCLUDED
>> 本页面仅前端演示，无法入侵任何电脑
[ FINISH SIMULATION ]
root@demo:~# _
`;
let index = 0;
const screen = document.getElementById('screen');
function type(){
  if(index < text.length){
    screen.innerHTML += text.charAt(index);
    index++;
    window.scrollTo(0,document.body.scrollHeight);
    setTimeout(type,30);
  }else{
    screen.innerHTML += '<span class="blink">█</span>'
  }
}
type();
</script>
</body>
</html>
